# Example Nginx reverse proxy for mail-log-viewer with HTTPS via Certbot
# Save as /etc/nginx/sites-available/mail-log-viewer and symlink to sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name mail-logs.example.com;

    # Certbot HTTP-01 challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail-logs.example.com;

    # Managed by Certbot (run: sudo certbot --nginx -d mail-logs.example.com)
    ssl_certificate /etc/letsencrypt/live/mail-logs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-logs.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Recommended since the app itself is intentionally unauthenticated:
    # Restrict access to your office/VPN IP or enable Nginx basic auth.
    # allow 203.0.113.10;
    # deny all;
    # auth_basic "Postfix Mail Log Viewer";
    # auth_basic_user_file /etc/nginx/.htpasswd-mail-logs;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dedicated SSE location for /api/stream (disable buffering)
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
